name: 模组市场收录与纠错
description: 申请新增模组、修正资料、报告失效链接或申请下架
title: "[市场目录] "
body:
  - type: markdown
    attributes:
      value: |
        此表单是公开申请，提交后不会自动进入模组市场。维护者会核对作者原帖、模组身份和链接；作者明确反对收录时会拒绝或下架。请勿在公开议题中填写私人信息。
  - type: dropdown
    id: request-type
    attributes:
      label: 申请类型
      options:
        - 新增收录
        - 信息纠错
        - 链接失效
        - 下架申请
    validations:
      required: true
  - type: input
    id: mod-name
    attributes:
      label: 模组名称或现有条目标识
      placeholder: 请填写模组名称；纠错或下架时也可填写市场条目标识
    validations:
      required: true
  - type: dropdown
    id: submitter-role
    attributes:
      label: 你与模组的关系
      options:
        - 作者本人
        - 玩家推荐
        - 其他知情者
    validations:
      required: true
  - type: input
    id: source-url
    attributes:
      label: 作者原帖或仓库链接
      description: 请提供可核验的 HTTPS 原出处；只支持 GitHub、百度贴吧和 Discord。转载页或网盘链接不能替代原出处。
      placeholder: https://...
    validations:
      required: true
  - type: input
    id: author
    attributes:
      label: 模组作者
      description: 新增收录时请填写；其他申请不清楚作者时可留空。
    validations:
      required: false
  - type: textarea
    id: description
    attributes:
      label: 模组简介
      description: 新增收录时请用简短文字说明模组内容；其他申请可留空。
    validations:
      required: false
  - type: textarea
    id: details
    attributes:
      label: 申请说明与核验线索
      description: 新增时说明原帖如何证明作者与模组的关系，以及下载或访问条件；纠错、失效、下架时说明具体问题并附证据。
    validations:
      required: true
  - type: input
    id: other-url
    attributes:
      label: 其他公开链接（可选）
      description: 如有独立说明页或下载说明，可补充 HTTPS 链接；维护者会另行核验。
    validations:
      required: false
  - type: checkboxes
    id: acknowledgement
    attributes:
      label: 提交确认
      options:
        - label: 我已查找现有市场条目与议题，并理解申请需要人工核验，且收录不代表安装包安全认证。
          required: true
