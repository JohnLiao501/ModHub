# ModHub 公开接口与网站入口，放入宝塔站点 extension 目录。
# 新增前合并既有同名 location；后端适配与客户端地址切换仍需另外完成。
# 市场索引保留 proxy 目录中的精确规则，其内容同步改为引用公共配置。
location = /mod-releases {
    include /www/server/panel/vhost/nginx/extension/dol.alseece.top/modhub-worker.inc;
}
location = /readme {
    include /www/server/panel/vhost/nginx/extension/dol.alseece.top/modhub-worker.inc;
}
location = /readme-image {
    include /www/server/panel/vhost/nginx/extension/dol.alseece.top/modhub-worker.inc;
}
location = /download {
    include /www/server/panel/vhost/nginx/extension/dol.alseece.top/modhub-worker.inc;
}
location = /health {
    include /www/server/panel/vhost/nginx/extension/dol.alseece.top/modhub-worker.inc;
}
location = /community-challenge {
    include /www/server/panel/vhost/nginx/extension/dol.alseece.top/modhub-worker.inc;
}
location = /community-submissions {
    include /www/server/panel/vhost/nginx/extension/dol.alseece.top/modhub-worker.inc;
}
location = /community-submissions/query {
    include /www/server/panel/vhost/nginx/extension/dol.alseece.top/modhub-worker.inc;
}
location = /community-submissions/query-batch {
    include /www/server/panel/vhost/nginx/extension/dol.alseece.top/modhub-worker.inc;
}
location = /community-submissions/target-status {
    include /www/server/panel/vhost/nginx/extension/dol.alseece.top/modhub-worker.inc;
}
location = /community-submissions/amend {
    include /www/server/panel/vhost/nginx/extension/dol.alseece.top/modhub-worker.inc;
}
location = /community-submissions/withdraw {
    include /www/server/panel/vhost/nginx/extension/dol.alseece.top/modhub-worker.inc;
}
location = /community-submissions/delete {
    include /www/server/panel/vhost/nginx/extension/dol.alseece.top/modhub-worker.inc;
}
location = /remote-assistance {
    include /www/server/panel/vhost/nginx/extension/dol.alseece.top/modhub-worker.inc;
}
location ^~ /remote-assistance/ {
    include /www/server/panel/vhost/nginx/extension/dol.alseece.top/modhub-worker.inc;
}

location = /mod-identities.json {
    resolver 223.5.5.5 223.6.6.6 ipv6=off valid=300s;
    resolver_timeout 5s;
    set $modhub_pages_upstream dolmod-catalog-pages.pages.dev;
    proxy_pass https://$modhub_pages_upstream;
    proxy_redirect off;
    proxy_http_version 1.1;
    proxy_set_header Host dolmod-catalog-pages.pages.dev;
    proxy_set_header Connection "";
    proxy_set_header Authorization "";
    proxy_set_header Cookie "";
    proxy_ssl_server_name on;
    proxy_ssl_name dolmod-catalog-pages.pages.dev;
    proxy_ssl_verify on;
    proxy_ssl_verify_depth 3;
    proxy_ssl_trusted_certificate /etc/pki/tls/certs/ca-bundle.crt;
    proxy_connect_timeout 10s;
    proxy_read_timeout 60s;
    proxy_cache off;
    expires off;
    proxy_intercept_errors off;
}

location = /modhub {
    return 308 /modhub/;
}
location = /modhub/index.html { return 308 /modhub/$is_args$args; }
location ^~ /modhub/ {
    resolver 223.5.5.5 223.6.6.6 ipv6=off valid=300s;
    resolver_timeout 5s;
    set $modhub_pages_upstream dolmod-catalog-pages.pages.dev;
    # 此前缀绕过全局正则，只公开当前市场页面和运行资源。
    if ($uri !~ "^/modhub/(index[.]html|dol-mod-extractor[.]js|modhub-market-variants[.]js|modhub-wiki-title[.]js|mod-identities[.]json|modhub-access-logo[.]svg)?$") {
        return 404;
    }
    rewrite ^/modhub/(.*)$ /$1 break;
    proxy_pass https://$modhub_pages_upstream;
    proxy_redirect off;
    proxy_http_version 1.1;
    proxy_set_header Host dolmod-catalog-pages.pages.dev;
    proxy_set_header Connection "";
    proxy_set_header Authorization "";
    proxy_set_header Cookie "";
    proxy_ssl_server_name on;
    proxy_ssl_name dolmod-catalog-pages.pages.dev;
    proxy_ssl_verify on;
    proxy_ssl_verify_depth 3;
    proxy_ssl_trusted_certificate /etc/pki/tls/certs/ca-bundle.crt;
    proxy_connect_timeout 10s;
    proxy_read_timeout 60s;
    proxy_cache off;
    expires off;
    proxy_intercept_errors off;
}
