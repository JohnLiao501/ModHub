<!doctype html>
<html lang="zh-CN">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ModHub 下载选版测试页</title>
<link rel="stylesheet" href="../src/stylesheet/modhub.css">
<link rel="stylesheet" href="../src/stylesheet/modhub-market.css">
<link rel="stylesheet" href="../src/stylesheet/modhub-overrides.css">
<style>
:root { --000:#fff; --400:#aaa; --600:#555; --800:#222; --850:#181818; --900:#111; --gold:#d4af37; }
body { margin:16px; background:#111; color:#ddd; color-scheme:dark; font:16px/1.6 Arial,sans-serif; }
.gold { color:#d4af37; } .grey { color:#aaa; } .green { color:#74ba70; } .red { color:#d76b6b; } .purple { color:#bd94d9; }
button { min-height:40px; border:1px solid #555; background:#222; color:#ddd; padding:8px 12px; cursor:pointer; }
.modhub-test-controls { display:flex; flex-wrap:wrap; gap:8px; }
#modHubTestResult { white-space:pre-wrap; overflow-wrap:anywhere; }
</style>
<h1 class="gold">下载选版测试页</h1>
<p>使用模拟目录和包体，不会操作真实模组仓库。弹窗、选版、组件选择与计划使用实际运行模块。</p>
<div class="modhub-test-controls">
<button data-case="audio">主包与音频扩展</button>
<button data-case="unknown">没有适配声明</button>
<button data-case="mismatch">没有匹配版本</button>
<button data-case="supplement">已装主包补装音频</button>
<button data-case="batch">批量安装</button>
</div>
<pre id="modHubTestResult" aria-live="polite"></pre>
<script src="../src/javascript/modhub-dialog.js"></script>
<script src="../src/javascript/modhub-market.js"></script>
<script src="../src/javascript/modhub-market-versions.js"></script>
<script>
window.StartConfig = { version:'0.5.12.13' };
const profiles = new Map();
const mod = { id:'deadwood-reblooms', identityId:'deadwood-reblooms', name:'枯木逢春', bootNames:['deadwood-reblooms'], githubUrl:'https://github.com/MaplebirchLeaf/Deadwood-Reblooms' };
const unknown = { id:'midsummer-night-dream', name:'多恋人淫啪', bootNames:['MidsummerNightDream'], githubUrl:'https://github.com/youmu1818/MND-Hotel' };
let testCase = 'audio';
const result = document.getElementById('modHubTestResult');
const state = () => window._modHubModState = { sideMods:[...profiles.keys()].map(name => ({name,enabled:true})), sideDisabled:[] };
state();
window.modHubGetModInfo = name => ({bootJson:profiles.get(name)?.bootJson});
window.modHubLoadModManageState = async () => state();
window.modHubRegisterOperationReload = () => {};
window.modHubClearMarketPreparationProgress = () => {};
window.modHubToggleSideMod = async () => true;
Object.assign(window.modHubMarket, {
    getLocalInstalledProfiles:() => [...profiles.values()],
    getMarketMods:() => [mod,unknown],
    getCurrentMirrorId:() => 'direct',
    renderMarketCards:() => {},
    renderBatchInstallToolbar:() => {},
    confirmInstallConflicts:async () => true,
    batchInstallState:{selected:new Set(),stopRequested:false},
    downloadAndInstallMod:async (target,mirror,options) => {
        const boots = options.releaseInfo.assets.map((asset,index) => ({name:asset.bootName || target.bootNames[0],version:options.releaseInfo.version,dependenceInfo:index ? [{modName:target.bootNames[0],version:`>=${options.releaseInfo.version}`}] : []}));
        if (options.prepareOnly) return {files:boots.map(() => ({})),boots,bytes:1,releaseInfo:options.releaseInfo};
        boots.forEach(boot => profiles.set(boot.name,{...boot,bootJson:boot}));
        state(); result.textContent = '模拟导入：'+boots.map(boot => boot.name).join('、');
        return true;
    }
});
window.modHubMarketVersions.fetchReleases = async (target,{page,signal} = {}) => {
    if (signal?.aborted) throw Object.assign(new Error('已取消'),{name:'AbortError'});
    const releases = target === unknown ? [{tagName:'V1.1',htmlUrl:target.githubUrl+'/releases/tag/V1.1',publishedAt:'2026-10-01',assets:[{name:'MND1.1.zip',downloadUrl:target.githubUrl+'/releases/download/V1.1/MND1.1.zip',size:500000}]}]
        : ['1.3.1','1.3.0'].map(version => {
            const game = testCase === 'mismatch' ? '0.5.12.14' : '0.5.12.13';
            const name = `deadwood-reblooms-${game}-v${version}.modpack`;
            const audio = `deadwood-reblooms-audio-${game}-v${version}.modpack`;
            return {tagName:'v'+version,htmlUrl:target.githubUrl+'/releases/tag/v'+version,publishedAt:'2026-10-03',assets:[
                {name,downloadUrl:target.githubUrl+'/releases/download/v'+version+'/'+name,size:1683400},
                {name:audio,downloadUrl:target.githubUrl+'/releases/download/v'+version+'/'+audio,size:1950664}
            ]};
        });
    return {schemaVersion:1,id:target.id,sourceUrl:target.githubUrl,page,hasMore:false,fetchedAt:new Date().toISOString(),releases};
};
</script>
<script src="../src/javascript/modhub-market-install.js"></script>
<script>
document.querySelectorAll('[data-case]').forEach(button => button.onclick = async () => {
    testCase=button.dataset.case; profiles.clear(); result.textContent='';
    if (testCase === 'supplement') { const boot={name:'deadwood-reblooms',version:'1.3.1',dependenceInfo:[]}; profiles.set(boot.name,{...boot,bootJson:boot}); }
    state();
    try {
        const context = {reloadOnChange:false};
        if (testCase === 'batch') await window.modHubMarketInstaller.installBatch([mod,unknown],{restoreContext:context});
        else await window.modHubMarketInstaller.install(testCase === 'unknown' ? unknown : mod,{restoreContext:context});
    } catch(error) { result.textContent=error.message; }
});
</script>
</html>
